        extend: {
          fontFamily: {
            sans: [
              "Inter",
              "ui-sans-serif",
              "system-ui",
              "sans-serif"
            ]
          },
          animation: {
            "fade-in": "fadeIn .45s ease-out",
            "slide-up": "slideUp .4s ease-out",
            "pulse-soft": "pulseSoft 2s infinite"
          },
          keyframes: {
            fadeIn: {
              "0%": {
                opacity: "0"
              },
              "100%": {
                opacity: "1"
              }
            },
            slideUp: {
              "0%": {
                opacity: "0",
                transform: "translateY(14px)"
              },
              "100%": {
                opacity: "1",
                transform: "translateY(0)"
              }
            },
            pulseSoft: {
              "0%, 100%": {
                transform: "scale(1)",
                opacity: ".75"
              },
              "50%": {
                transform: "scale(1.04)",
                opacity: "1"
              }
            }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    #root {
      min-height: 100%;
      margin: 0;
    }

    body {
      background: #020617;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f8fafc;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 999px;
    }

    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }

    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .line-clamp-1 {
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 1;
    }

    .line-clamp-2 {
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }

    @media (max-width: 767px) {
      body {
        background: #0f172a;
      }
    }
  </style>
</head>

    /* =========================================================
       UTILITIES
    ========================================================= */

    function loadSavedState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : null;
      } catch {
        return null;
      }
    }

    function saveState(state) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch {
        // Demo mode can continue without persistence.
      }
    }

    function getInitialState() {
      const saved = loadSavedState();

      if (!saved) {
        return {
          user: DEFAULT_USER,
          professionals: INITIAL_PROFESSIONALS,
          conversations: INITIAL_CONVERSATIONS,
          notifications: INITIAL_NOTIFICATIONS
        };
      }

      return {
        user: {
          ...DEFAULT_USER,
          ...(saved.user || {})
        },
        professionals:
          saved.professionals?.length
            ? saved.professionals
            : INITIAL_PROFESSIONALS,
        conversations:
          saved.conversations || INITIAL_CONVERSATIONS,
        notifications:
          saved.notifications || INITIAL_NOTIFICATIONS
      };
    }

    /* =========================================================
       ROOT APP
    ========================================================= */

    function App() {
      const savedState = useMemo(getInitialState, []);

      const [currentScreen, setCurrentScreen] = useState("splash");
      const [authMode, setAuthMode] = useState("signup");
      const [activeTab, setActiveTab] = useState("home");
      const [viewDeviceFrame, setViewDeviceFrame] = useState(true);

      const [user, setUser] = useState(savedState.user);
      const [professionals, setProfessionals] = useState(
        savedState.professionals
      );
      const [conversations, setConversations] = useState(
        savedState.conversations
      );
      const [notifications, setNotifications] = useState(
        savedState.notifications
      );

      const [selectedProfId, setSelectedProfId] = useState(null);
      const [activeChatId, setActiveChatId] = useState(null);
      const [showFilterModal, setShowFilterModal] = useState(false);
      const [showPremiumModal, setShowPremiumModal] = useState(false);
      const [showEditProfileModal, setShowEditProfileModal] = useState(false);
      const [showNotifications, setShowNotifications] = useState(false);
      const [toastMessage, setToastMessage] = useState("");

      const [searchQuery, setSearchQuery] = useState("");
      const [filterRole, setFilterRole] = useState("ALL");
      const [filterLocation, setFilterLocation] = useState("ALL");
      const [filterExpertise, setFilterExpertise] = useState("ALL");

      /* Splash */
      useEffect(() => {
        if (currentScreen === "splash") {
          const timer = setTimeout(() => {
            setCurrentScreen("onboarding");
          }, 1800);

          return () => clearTimeout(timer);
        }
      }, [currentScreen]);

      /* Persist */
      useEffect(() => {
        saveState({
          user,
          professionals,
          conversations,
          notifications
        });
      }, [
        user,
        professionals,
        conversations,
        notifications
      ]);

      /* Toast */
      const showToast = (message) => {
        setToastMessage(message);

        window.clearTimeout(window.__realnetToastTimer);

        window.__realnetToastTimer = window.setTimeout(() => {
          setToastMessage("");
        }, 2800);
      };

      /* Search/filter */
      const filteredProfessionals = useMemo(() => {
        const query = searchQuery.trim().toLowerCase();

        return professionals.filter((professional) => {
          const matchesSearch =
            !query ||
            professional.name.toLowerCase().includes(query) ||
            professional.role.toLowerCase().includes(query) ||
            professional.company.toLowerCase().includes(query) ||
            professional.location.toLowerCase().includes(query) ||
            professional.expertise.some((item) =>
              item.toLowerCase().includes(query)
            );

          const matchesRole =
            filterRole === "ALL" ||
            professional.role === filterRole;

          const matchesLocation =
            filterLocation === "ALL" ||
            professional.location === filterLocation;

          const matchesExpertise =
            filterExpertise === "ALL" ||
            professional.expertise.includes(filterExpertise);

          return (
            matchesSearch &&
            matchesRole &&
            matchesLocation &&
            matchesExpertise
          );
        });
      }, [
        professionals,
        searchQuery,
        filterRole,
        filterLocation,
        filterExpertise
      ]);

      const unreadMessagesCount = conversations.filter(
        (conversation) => conversation.unread
      ).length;

      const pendingRequestsCount =
        user.pendingReceivedIds.length;

      const unreadNotifsCount = notifications.filter(
        (notification) => !notification.read
      ).length;

      /* =====================================================
         CONNECTION FLOW
      ===================================================== */

      const handleConnectAction = (profId) => {
        if (user.connectedIds.includes(profId)) {
          return;
        }

        if (user.pendingSentIds.includes(profId)) {
          setUser((prev) => ({
            ...prev,
            pendingSentIds: prev.pendingSentIds.filter(
              (id) => id !== profId
            )
          }));

          showToast("Connection request withdrawn.");
          return;
        }

        setUser((prev) => ({
          ...prev,
          pendingSentIds: [
            ...prev.pendingSentIds,
            profId
          ]
        }));

        showToast("Connection request sent.");
      };

      const handleAcceptRequest = (profId) => {
        const professional = professionals.find(
          (item) => item.id === profId
        );

        setUser((prev) => ({
          ...prev,
          pendingReceivedIds:
            prev.pendingReceivedIds.filter(
              (id) => id !== profId
            ),
          connectedIds: [
            ...new Set([
              ...prev.connectedIds,
              profId
            ])
          ]
        }));

        setNotifications((prev) =>
          prev.filter(
            (notification) =>
              !(
                notification.profId === profId &&
                notification.type === "connection_request"
              )
          )
        );

        showToast(
          `You are now connected with ${
            professional?.name || "this professional"
          }.`
        );
      };

      const handleDeclineRequest = (profId) => {
        setUser((prev) => ({
          ...prev,
          pendingReceivedIds:
            prev.pendingReceivedIds.filter(
              (id) => id !== profId
            )
        }));

        setNotifications((prev) =>
          prev.filter(
            (notification) =>
              !(
                notification.profId === profId &&
                notification.type === "connection_request"
              )
          )
        );

        showToast("Connection request declined.");
      };

      /* =====================================================
         MESSAGING
      ===================================================== */

      const handleOpenChatWithProf = (profId) => {
        let conversation = conversations.find(
          (item) => item.profId === profId
        );

        if (!conversation) {
          const newConversation = {
            id: `conv-${Date.now()}`,
            profId,
            lastMessage:
              "Connection established. Start the conversation.",
            timestamp: "Just now",
            unread: false,
            messages: []
          };

          setConversations((prev) => [
            newConversation,
            ...prev
          ]);

          setActiveChatId(newConversation.id);
        } else {
          setConversations((prev) =>
            prev.map((item) =>
              item.id === conversation.id
                ? {
                    ...item,
                    unread: false
                  }
                : item
            )
          );

          setActiveChatId(conversation.id);
        }

        setActiveTab("messages");
        setSelectedProfId(null);
      };

      const handleSendMessage = (chatId, text) => {
        const cleanText = text.trim();

        if (!cleanText) {
          return;
        }

        const currentTime = new Date().toLocaleTimeString(
          [],
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );

        setConversations((prev) =>
          prev.map((conversation) => {
            if (conversation.id !== chatId) {
              return conversation;
            }

            return {
              ...conversation,
              lastMessage: cleanText,
              timestamp: "Just now",
              unread: false,
              messages: [
                ...conversation.messages,
                {
                  id: `m-${Date.now()}`,
                  sender: "me",
                  text: cleanText,
                  time: currentTime
                }
              ]
            };
          })
        );
      };

      /* =====================================================
         PREMIUM
      ===================================================== */

      const handleSubscribePro = (plan) => {
        setUser((prev) => ({
          ...prev,
          isPro: true,
          subscriptionPlan: plan

        setShowPremiumModal(false);

        showToast(

      /* =====================================================

      ===================================================== */

      const handleProfileSave = (updated) => {
        setUser((prev) => ({
          ...prev,

        setShowEditProfileModal(false);

        showToast("Profile updated.");

      /* =====================================================
         NOTIFICATIONS
      ===================================================== */

      const markAllNotificationsRead = () => {
        setNotifications((prev) =>
          prev.map((notification) => ({
            ...notification,
            read: true
          }))

      };

      /* =====================================================
         SPLASH
      ===================================================== */

      if (currentScreen === "splash") {
        return (
          <SplashScreen />

      }

      /* =====================================================
         ONBOARDING
      ===================================================== */

      if (currentScreen === "onboarding") {
        return (
          <OnboardingScreen
            onFinish={() =>
              setCurrentScreen("auth")
            }
          />
        );
      }

      /* =====================================================
         AUTH
      ===================================================== */

      if (currentScreen === "auth") {
        return (
          <AuthScreen
            mode={authMode}
            setMode={setAuthMode}
            onSuccess={(data) => {
              setUser((prev) => ({
                ...prev,
                ...data
              }));

              setCurrentScreen("role_select");
            }}
          />
        );
      }

      /* =====================================================
         ROLE
      ===================================================== */

      if (currentScreen === "role_select") {
        return (
          <RoleSelectScreen
            selectedRole={user.role}
            onSelectRole={(role) => {
              setUser((prev) => ({
                ...prev,
                role
              }));

              setCurrentScreen("profile_setup");
            }}
          />
        );
      }

      /* =====================================================
         PROFILE SETUP
      ===================================================== */

      if (currentScreen === "profile_setup") {
        return (
          <ProfileSetupScreen
            user={user}
            onSave={(data) => {
              setUser((prev) => ({
                ...prev,
                ...data
              }));

              setCurrentScreen("app_main");

              showToast(
                "Profile created. Welcome to REALNET."
              );
            }}
          />
        );
      }

      /* =====================================================
         MAIN APP
      ===================================================== */

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center">
          {/* Desktop preview toolbar */}
          <div className="hidden md:flex w-full max-w-md items-center justify-between bg-slate-900 border-b border-slate-800 px-4 py-2 text-xs">
            <div className="flex items-center gap-2">
              <Smartphone className="w-3.5 h-3.5 text-emerald-400" />
              <span className="font-medium text-slate-300">
                REALNET Prototype
              </span>
            </div>

            <button
              type="button"
              onClick={() =>
                setViewDeviceFrame((prev) => !prev)
              }
              className="text-emerald-400 hover:text-emerald-300"
            >
              {viewDeviceFrame
                ? "Expanded View"
                : "Phone Frame"}
            </button>
          </div>

          <main
            className={[
              "relative flex flex-col overflow-hidden bg-slate-900",
              viewDeviceFrame
                ? "w-full max-w-md min-h-[844px] md:rounded-2xl md:border md:border-slate-800 md:shadow-2xl"
                : "w-full max-w-4xl min-h-screen"
            ].join(" ")}
          >
            {/* Toast */}
            {toastMessage && (
              <div className="absolute left-4 right-4 top-4 z-[100] animate-slide-up">
                <div className="flex items-center justify-between gap-3 rounded-xl border border-emerald-400/30 bg-emerald-500 px-4 py-3 text-xs font-semibold text-slate-950 shadow-2xl">
                  <div className="flex items-center gap-2">
                    <CheckCircle className="h-4 w-4 shrink-0" />
                    <span>{toastMessage}</span>
                  </div>

                  <button
                    type="button"
                    onClick={() => setToastMessage("")}
                    aria-label="Close notification"
                  >

    function MessagesHubScreen({
      conversations,
      professionals,
      activeChatId,
      setActiveChatId,
      onSendMessage,
      onSelectProf
    }) {
      const [inputText, setInputText] =
        useState("");

      const activeConversation =
        conversations.find(
          (conversation) =>
            conversation.id === activeChatId
        );

      const activeProfessional =
        activeConversation
          ? professionals.find(
              (professional) =>
                professional.id ===
                activeConversation.profId
            )
          : null;

      if (activeChatId) {
        return (
          <div className="flex h-[calc(100vh-4rem)] min-h-[700px] flex-col bg-slate-900">
            <div className="flex items-center gap-3 border-b border-slate-700/80 bg-slate-800 p-3">
              <button
                type="button"
                onClick={() =>
                  setActiveChatId(null)
                }
                className="rounded-lg p-1 text-slate-400 hover:text-white"
                aria-label="Back to messages"
              >
                <ArrowLeft className="h-5 w-5" />
              </button>

              {activeProfessional && (
                <button
                  type="button"
                  onClick={() =>
                    onSelectProf(
                      activeProfessional.id
                    )
                  }
                  className="flex items-center gap-2.5 text-left"
                >
                  <img
                    src={activeProfessional.avatar}
                    alt={activeProfessional.name}
                    className="h-9 w-9 rounded-full border border-slate-600 object-cover"
                  />

                  <div>
                    <h4 className="text-xs font-bold text-white">
                      {activeProfessional.name}
                    </h4>

                    <p className="text-[10px] text-emerald-400">
                      {activeProfessional.role} ·{" "}
                      {activeProfessional.company}
                    </p>
                  </div>
                </button>
              )}
            </div>

            <div className="flex-1 space-y-3 overflow-y-auto p-4">
              {activeConversation?.messages?.length === 0 ? (
                <div className="flex min-h-full items-center justify-center">
                  <div className="max-w-xs text-center">
                    <MessageSquare className="mx-auto mb-3 h-9 w-9 text-slate-600" />
                    <p className="text-sm font-semibold text-slate-300">
                      Start the conversation
                    </p>
                    <p className="mt-1 text-xs leading-relaxed text-slate-500">
                      Introduce yourself and explain what
                      you're looking to connect about.
                    </p>
                  </div>
                </div>
              ) : (
                activeConversation?.messages?.map(
                  (message) => {
                    const isMe =
                      message.sender === "me";

                    return (
                      <div
                        key={message.id}
                        className={[
                          "flex flex-col",
                          isMe
                            ? "items-end"
                            : "items-start"
                        ].join(" ")}
                      >
                        <div
                          className={[
                            "max-w-[82%] rounded-2xl px-3.5 py-2.5 text-xs leading-relaxed",
                            isMe
                              ? "rounded-br-sm bg-emerald-500 font-medium text-slate-950"
                              : "rounded-bl-sm border border-slate-700/80 bg-slate-800 text-slate-100"
                          ].join(" ")}
                        >
                          {message.text}
                        </div>

                        <span className="mt-1 px-1 text-[9px] text-slate-500">
                          {message.time}
                        </span>
                      </div>
                    );
                  }
                )
              )}
            </div>

            <form
              onSubmit={(event) => {
                event.preventDefault();

                onSendMessage(
                  activeChatId,
                  inputText
                );

                setInputText("");
              }}
              className="border-t border-slate-700/80 bg-slate-800 p-3"
            >
              <div className="flex items-center gap-2">
                <input
                  type="text"
                  value={inputText}
                  onChange={(event) =>
                    setInputText(event.target.value)
                  }
                  placeholder="Type a message..."
                  className="min-w-0 flex-1 rounded-xl border border-slate-700 bg-slate-900 px-3.5 py-2.5 text-xs text-white outline-none placeholder:text-slate-500 focus:border-emerald-500"
                />

                <button
                  type="submit"
                  className="flex h-10 w-10 items-center justify-center rounded-xl bg-emerald-500 text-slate-950 transition hover:bg-emerald-400"
                  aria-label="Send message"
                >
                  <Send className="h-4 w-4" />
                </button>
              </div>
            </form>
          </div>
        );
      }

      return (
        <div className="space-y-4 p-4 animate-slide-up">
          <div className="pt-2">
            <h2 className="text-lg font-bold text-white">
              Messages
            </h2>
            <p className="mt-0.5 text-[11px] text-slate-500">
              Communicate with your professional network
            </p>
          </div>

          {conversations.length === 0 ? (
            <EmptyState
              icon={<MessageSquare className="h-8 w-8" />}
              title="No conversations"
              description="Connect with professionals to start messaging."
            />
          ) : (
            <div className="space-y-2">
              {conversations.map((conversation) => {
                const professional =
                  professionals.find(
                    (item) =>
                      item.id ===
                      conversation.profId
                  );

                if (!professional) {
                  return null;
                }

                return (
                  <button
                    type="button"
                    key={conversation.id}
                    onClick={() =>
                      setActiveChatId(
                        conversation.id
                      )
                    }
                    className="flex w-full items-center justify-between rounded-xl border border-slate-700/60 bg-slate-800/70 p-3.5 text-left transition hover:bg-slate-800"
                  >
                    <div className="flex min-w-0 items-center gap-3">
                      <img
                        src={professional.avatar}
                        alt={professional.name}
                        className="h-11 w-11 rounded-full border border-slate-600 object-cover"
                      />

                      <div className="min-w-0">
                        <div className="flex items-center gap-2">
                          <h4 className="truncate text-xs font-bold text-white">
                            {professional.name}
                          </h4>

                          <span className="shrink-0 text-[10px] text-slate-500">
                            {conversation.timestamp}
                          </span>
                        </div>

                        <p className="mt-1 line-clamp-1 text-[11px] text-slate-400">
                          {conversation.lastMessage}
                        </p>
                      </div>
                    </div>

                    {conversation.unread && (
                      <span className="ml-2 h-2.5 w-2.5 shrink-0 rounded-full bg-emerald-500" />
                    )}
                  </button>
                );
              })}
            </div>
          )}
        </div>
      );
    }

              icon={<CreditCard className="h-4 w-4" />}

              onClick={onOpenPro}
              accent
            />

            <SettingsRow
              icon={<LogOut className="h-4 w-4" />}
              label="Log Out"
              onClick={onLogout}
              danger
              last
            />
          </div>
        </div>
      );
    }

    /* =========================================================
       PREMIUM
    ========================================================= */

    function PremiumPaywallModal({
      user,
      onSubscribe,
      onClose
    }) {
      const [selectedPlan, setSelectedPlan] =
        useState("annual");

      return (
        <ModalOverlay onClose={onClose}>
          <div className="w-full max-w-sm rounded-2xl border border-slate-700/80 bg-slate-900 p-5 shadow-2xl">
            <div className="flex items-start justify-between">
              <div>
                <div className="mb-3 flex h-12 w-12 items-center justify-center rounded-2xl border border-amber-500/30 bg-amber-500/10">
                  <Crown className="h-6 w-6 text-amber-400" />
                </div>

                <h3 className="text-lg font-extrabold text-white">
                  REALNET PRO
                </h3>

                <p className="mt-1 text-xs text-slate-400">
                  More tools for building your professional network
                </p>
              </div>

              <button
                type="button"
                onClick={onClose}
                className="text-slate-400 hover:text-white"
              >
                <X className="h-5 w-5" />
              </button>
            </div>

            <div className="mt-5 space-y-2">
              {[
                "Expanded networking access",
                "Advanced discovery filters",
                "Featured profile placement",
                "Ad-free experience"
              ].map((benefit) => (
                <div
                  key={benefit}
                  className="flex items-start gap-2 text-xs text-slate-300"
                >
                  <Check className="mt-0.5 h-4 w-4 shrink-0 text-emerald-400" />
                  <span>{benefit}</span>
                </div>
              ))}
            </div>

            <div className="mt-5 space-y-2">
              <PlanCard
                selected={selectedPlan === "annual"}
                onClick={() =>
                  setSelectedPlan("annual")
                }
                title="Annual"
                subtitle="$119.99 / year"
                detail="Best for long-term professional networking"
              />

              <PlanCard
                selected={selectedPlan === "monthly"}
                onClick={() =>
                  setSelectedPlan("monthly")
                }
                title="Monthly"
                subtitle="$14.99 / month"
                detail="Flexible monthly membership"
              />
            </div>

            <button
              type="button"
              onClick={() =>
                onSubscribe(selectedPlan)
              }
              className="mt-5 w-full rounded-xl bg-emerald-500 py-3.5 text-xs font-extrabold text-slate-950 transition hover:bg-emerald-400"
            >
              {user.isPro
                ? "Membership Active"
                : "Start 7-Day Free Trial"}
            </button>

            <p className="mt-3 text-center text-[10px] text-slate-500">
              Prototype billing flow. Connect to a real
              payment provider for production.
            </p>
          </div>
        </ModalOverlay>
      );
    }

    /* =========================================================
       FILTER MODAL
    ========================================================= */

    function FilterModal({
      filterRole,
      setFilterRole,
      filterLocation,
      setFilterLocation,
      filterExpertise,
      setFilterExpertise,
      onClose,
      onReset
    }) {
      const roles = [
        "ALL",
        "REALTOR",
        "BROKER",
        "INVESTOR",
        "LENDER",
        "PROPERTY MANAGER",
        "CONTRACTOR",
        "DEVELOPER"
      ];

      const locations = [
        "ALL",
        "Elyria, OH",
        "Cleveland, OH",
        "Akron, OH",
        "Columbus, OH"
      ];

      const expertise = [
        "ALL",
        "Residential",
        "Commercial",
        "Multi-Family",
        "Mortgage",
        "Investment",
        "Property Management",
        "Renovation"
      ];

      return (
        <div className="absolute inset-0 z-50 bg-slate-950/80 backdrop-blur-sm">
          <div className="absolute bottom-0 left-0 right-0 mx-auto max-w-md rounded-t-2xl border-t border-slate-700 bg-slate-900 p-5 shadow-2xl">
            <div className="flex items-center justify-between">
              <h3 className="text-sm font-bold text-white">
                Filter Professionals
              </h3>

              <button
                type="button"
                onClick={onClose}
                className="text-slate-400 hover:text-white"
              >
                <X className="h-5 w-5" />
              </button>
            </div>

            <FilterGroup
              title="Professional Role"
              items={roles}
              value={filterRole}
              onChange={setFilterRole}
            />

            <FilterGroup
              title="Location"
              items={locations}
              value={filterLocation}
              onChange={setFilterLocation}
            />

            <FilterGroup
              title="Expertise"
              items={expertise}
              value={filterExpertise}
              onChange={setFilterExpertise}
            />

            <div className="mt-6 flex gap-3">
              <button
                type="button"
                onClick={onReset}
                className="flex-1 rounded-xl border border-slate-700 bg-slate-800 py-3 text-xs font-semibold text-slate-300 hover:bg-slate-700"
              >
                Reset
              </button>

              <button
                type="button"
                onClick={onClose}
                className="flex-1 rounded-xl bg-emerald-500 py-3 text-xs font-bold text-slate-950 hover:bg-emerald-400"
              >
                Apply Filters
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* =========================================================
       EDIT PROFILE
    ========================================================= */

    function EditProfileModal({
      user,
      onSave,
      onClose
    }) {
      const [formData, setFormData] =
        useState({
          company: user.company || "",
          location: user.location || "",
          bio: user.bio || ""
        });

      return (
        <ModalOverlay onClose={onClose}>
          <div className="w-full max-w-sm rounded-2xl border border-slate-700 bg-slate-900 p-5">
            <div className="flex items-center justify-between">
              <h3 className="text-sm font-bold text-white">
                Edit Profile
              </h3>

              <button
                type="button"
                onClick={onClose}
                className="text-slate-400 hover:text-white"
              >
                <X className="h-5 w-5" />
              </button>
            </div>

            <div className="mt-4 space-y-3">
              <Field
                label="Company"
                value={formData.company}
                onChange={(value) =>
                  setFormData((prev) => ({
                    ...prev,
                    company: value
                  }))
                }
              />

              <Field
                label="Location"
                value={formData.location}
                onChange={(value) =>
                  setFormData((prev) => ({
                    ...prev,
                    location: value
                  }))
                }
              />

              <TextareaField
                label="Bio"
                value={formData.bio}
                onChange={(value) =>
                  setFormData((prev) => ({
                    ...prev,
                    bio: value
                  }))
                }
              />
            </div>

            <button
              type="button"
              onClick={() => onSave(formData)}
              className="mt-5 w-full rounded-xl bg-emerald-500 py-3 text-xs font-bold text-slate-950 hover:bg-emerald-400"
            >
              Save Changes
            </button>
          </div>
        </ModalOverlay>
      );
    }

    /* =========================================================
       NOTIFICATIONS
    ========================================================= */

    function NotificationsPanel({
      notifications,
      professionals,
      onClose,
      onMarkRead,
      onAccept
    }) {
      return (
        <div className="absolute inset-0 z-50 bg-slate-950/80 backdrop-blur-sm">
          <div className="absolute bottom-0 left-0 right-0 top-0 mx-auto flex max-w-md flex-col bg-slate-900">
            <div className="flex items-center justify-between border-b border-slate-800 p-4">
              <div>
                <h3 className="text-base font-bold text-white">
                  Notifications
                </h3>
                <p className="mt-0.5 text-[11px] text-slate-500">
                  Stay up to date with your network
                </p>
              </div>

              <div className="flex items-center gap-3">
                <button
                  type="button"
                  onClick={onMarkRead}
                  className="text-[10px] font-semibold text-emerald-400"
                >
                  Mark all read
                </button>

                <button
                  type="button"
                  onClick={onClose}
                  className="text-slate-400 hover:text-white"
                >
                  <X className="h-5 w-5" />
                </button>
              </div>
            </div>

            <div className="flex-1 space-y-2 overflow-y-auto p-4">
              {notifications.length === 0 ? (
                <EmptyState
                  icon={<Bell className="h-8 w-8" />}
                  title="You're all caught up"
                  description="No new notifications."
                />
              ) : (
                notifications.map((notification) => {
                  const professional =
                    professionals.find(
                      (item) =>
                        item.id ===
                        notification.profId
                    );

                  return (
                    <div
                      key={notification.id}
                      className={[
                        "rounded-xl border p-3.5",
                        notification.read
                          ? "border-slate-800 bg-slate-800/40"
                          : "border-emerald-500/20 bg-emerald-500/5"
                      ].join(" ")}
                    >
                      <div className="flex items-start gap-3">
                        {professional ? (
                          <img
                            src={
                              professional.avatar
                            }
                            alt={
                              professional.name
                            }
                            className="h-10 w-10 rounded-full border border-slate-700 object-cover"
                          />
                        ) : (
                          <div className="flex h-10 w-10 items-center justify-center rounded-full bg-slate-800">
                            <Bell className="h-4 w-4 text-slate-500" />
                          </div>
                        )}

                        <div className="min-w-0 flex-1">
                          <p className="text-xs leading-relaxed text-slate-300">
                            <span className="font-semibold text-white">
                              {professional
                                ?.name ||
                                "REALNET"}
                            </span>{" "}
                            {notification.text}
                          </p>

                          <p className="mt-1 text-[10px] text-slate-500">
                            {notification.time}
                          </p>

                          {notification.actionNeeded &&
                            professional && (
                              <button
                                type="button"
                                onClick={() =>
                                  onAccept(
                                    professional.id
                                  )
                                }
                                className="mt-3 rounded-lg bg-emerald-500 px-3 py-1.5 text-[10px] font-bold text-slate-950"
                              >
                                Accept Connection
                              </button>
                            )}
                        </div>

                        {!notification.read && (
                          <span className="mt-1 h-2 w-2 rounded-full bg-emerald-500" />
                        )}
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          </div>
        </div>
      );
    }

    /* =========================================================
       REUSABLE UI
    ========================================================= */

    function ProfessionalCard({
      prof,
      user,
      onSelect,
      onConnect
    }) {
      const isConnected =
        user.connectedIds.includes(
          prof.id
        );

      const isPending =
        user.pendingSentIds.includes(
          prof.id
        );

      return (
        <article className="rounded-xl border border-slate-700/70 bg-slate-800/80 p-3.5 transition hover:border-slate-600">
          <button
            type="button"
            onClick={onSelect}
            className="flex w-full items-start gap-3 text-left"
          >
            <img
              src={prof.avatar}
              alt={prof.name}
              className="h-12 w-12 shrink-0 rounded-full border border-slate-600 object-cover"
            />

            <div className="min-w-0 flex-1">
              <div className="flex items-start justify-between gap-2">
                <h4 className="truncate text-xs font-bold text-white">
                  {prof.name}
                </h4>

                <span className="shrink-0 rounded border border-emerald-500/20 bg-emerald-500/10 px-2 py-0.5 text-[9px] font-bold text-emerald-400">
                  {prof.role}
                </span>
              </div>

              <p className="mt-0.5 truncate text-[11px] text-slate-300">
                {prof.company}
              </p>

              <p className="mt-0.5 flex items-center text-[10px] text-slate-400">
                <MapPin className="mr-0.5 h-3 w-3 text-slate-500" />
                {prof.location}
              </p>
            </div>
          </button>

          <p className="mt-3 line-clamp-2 text-[11px] leading-relaxed text-slate-400">
            {prof.bio}
          </p>

          <div className="mt-3 flex items-center justify-between border-t border-slate-700/50 pt-3">
            <span className="text-[10px] text-slate-500">
              {prof.connectionsCount} connections
            </span>

            <button
              type="button"
              onClick={onConnect}
              className={[
                "rounded-lg px-3 py-1.5 text-xs font-bold transition",
                isConnected
                  ? "bg-slate-700 text-emerald-400"
                  : isPending
                  ? "border border-amber-500/20 bg-amber-500/10 text-amber-400"
                  : "bg-emerald-500 text-slate-950 hover:bg-emerald-400"
              ].join(" ")}
            >
              {isConnected
                ? "Connected"
                : isPending
                ? "Pending"
                : "+ Connect"}
            </button>
          </div>
        </article>
      );
    }

    function NavItem({
      icon,
      label,
      badge,
      active,
      onClick
    }) {
      return (
        <button
          type="button"
          onClick={onClick}
          className={[
            "relative flex h-full flex-1 flex-col items-center justify-center transition",
            active
              ? "text-emerald-400"
              : "text-slate-400 hover:text-slate-200"
          ].join(" ")}
        >
          <div className="relative">
            {icon}

            {badge && (
              <span className="absolute -right-2 -top-1 flex h-4 min-w-4 items-center justify-center rounded-full border border-slate-900 bg-emerald-500 px-1 text-[9px] font-extrabold text-slate-950">
                {badge}
              </span>
            )}
          </div>

          <span className="mt-1 text-[10px] font-medium">
            {label}
          </span>
        </button>
      );
    }

    function BuildingIcon({ className = "" }) {
      return (
        <svg
          className={className}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          aria-hidden="true"
        >
          <rect
            x="4"
            y="2"
            width="16"
            height="20"
            rx="2"
          />
          <path d="M9 22v-4h6v4" />
          <path d="M8 6h.01" />
          <path d="M16 6h.01" />
          <path d="M8 10h.01" />
          <path d="M16 10h.01" />
          <path d="M8 14h.01" />
          <path d="M16 14h.01" />
        </svg>
      );
    }

    function Field({
      label,
      value,
      onChange,
      placeholder = "",
      type = "text"
    }) {
      return (
        <label className="block">
          <span className="mb-1 block text-xs font-medium text-slate-400">
            {label}
          </span>

          <input
            type={type}
            value={value}
            onChange={(event) =>
              onChange(event.target.value)
            }
            placeholder={placeholder}
            className="w-full rounded-xl border border-slate-700 bg-slate-800/80 px-3.5 py-2.5 text-sm text-white outline-none placeholder:text-slate-600 focus:border-emerald-500"
          />
        </label>
      );
    }

    function TextareaField({
      label,
      value,
      onChange,
      placeholder = ""
    }) {
      return (
        <label className="block">
          <span className="mb-1 block text-xs font-medium text-slate-400">
            {label}
          </span>

          <textarea
            rows="3"
            value={value}
            onChange={(event) =>
              onChange(event.target.value)
            }
            placeholder={placeholder}
            className="w-full resize-none rounded-xl border border-slate-700 bg-slate-800/80 px-3.5 py-2.5 text-sm text-white outline-none placeholder:text-slate-600 focus:border-emerald-500"
          />
        </label>
      );
    }

    function ModalOverlay({
      children,
      onClose
    }) {
      return (
        <div
          className="absolute inset-0 z-50 flex items-center justify-center bg-slate-950/80 p-4 backdrop-blur-sm"
          onMouseDown={(event) => {
            if (event.target === event.currentTarget) {
              onClose();
            }
          }}
        >
          {children}
        </div>
      );
    }

    function FilterGroup({
      title,
      items,
      value,
      onChange
    }) {
      return (
        <div className="mt-5">
          <p className="mb-2 text-xs font-bold text-slate-400">
            {title}
          </p>

          <div className="flex flex-wrap gap-1.5">
            {items.map((item) => (
              <button
                type="button"
                key={item}
                onClick={() => onChange(item)}
                className={[
                  "rounded-lg px-3 py-1.5 text-[11px] font-medium transition",
                  value === item
                    ? "bg-emerald-500 font-bold text-slate-950"
                    : "border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700"
                ].join(" ")}
              >
                {item}
              </button>
            ))}
          </div>
        </div>
      );
    }

    function EmptyState({
      icon,
      title,
      description
    }) {
      return (
        <div className="rounded-2xl border border-slate-800 bg-slate-800/30 px-6 py-12 text-center">
          <div className="mx-auto mb-3 w-fit text-slate-600">
            {icon}
          </div>

          <p className="text-sm font-semibold text-slate-300">
            {title}
          </p>

          <p className="mx-auto mt-1 max-w-xs text-xs leading-relaxed text-slate-500">
            {description}
          </p>
        </div>
      );
    }

    function InfoRow({
      label,
      value,
      last = false
    }) {
      return (
        <div
          className={[
            "flex items-start justify-between gap-4 py-2.5",
            !last &&
              "border-b border-slate-700/60"
          ].join(" ")}
        >
          <span className="text-xs text-slate-500">
            {label}
          </span>

          <span className="text-right text-xs font-medium text-slate-200">
            {value}
          </span>
        </div>
      );
    }

    function SettingsRow({
      icon,
      label,
      onClick,
      accent = false,
      danger = false,
      last = false
    }) {
      return (
        <button
          type="button"
          onClick={onClick}
          className={[
            "flex w-full items-center justify-between px-3.5 py-3.5 text-left transition hover:bg-slate-800",
            !last &&
              "border-b border-slate-700/60",
            danger
              ? "text-rose-400"
              : "text-slate-200"
          ].join(" ")}
        >
          <span className="flex items-center text-xs">
            <span
              className={[
                "mr-2.5",
                accent
                  ? "text-emerald-400"
                  : danger
                  ? "text-rose-400"
                  : "text-slate-400"
              ].join(" ")}
            >
              {icon}
            </span>

            {label}
          </span>

          {!danger && (
            <ChevronRight className="h-4 w-4 text-slate-500" />
          )}
        </button>
      );
    }

    function PlanCard({
      selected,
      onClick,
      title,
      subtitle,
      detail
    }) {
      return (
        <button
          type="button"
          onClick={onClick}
          className={[
            "w-full rounded-xl border p-3 text-left transition",
            selected
              ? "border-emerald-500 bg-emerald-500/10"
              : "border-slate-700 bg-slate-800"
          ].join(" ")}
        >
          <div className="flex items-center justify-between gap-3">
            <div>
              <p className="text-xs font-bold text-white">
                {title}
              </p>
              <p className="mt-0.5 text-[10px] text-emerald-400">
                {subtitle}
              </p>
            </div>

            {selected && (
              <CheckCircle className="h-4 w-4 shrink-0 text-emerald-400" />
            )}
          </div>

          <p className="mt-2 text-[10px] leading-relaxed text-slate-500">
            {detail}
          </p>
        </button>
      );
    }

    /* =========================================================
       MOUNT APP
    ========================================================= */

    const root =
      ReactDOM.createRoot(
        document.getElementById("root")
      );

    root.render(<App />);
  </script>
</body>
</html>
